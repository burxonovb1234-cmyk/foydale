name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Java 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK tayyorlash
        uses: android-actions/setup-android@v3

      - name: Gradle tayyorlash
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sayt fayllarini ilovaga nusxalash
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest icon-192.png icon-512.png android/app/src/main/assets/

      - name: APK yig'ish
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: APK nomini tuzatish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk foydale.apk

      - name: APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: foydale-apk
          path: foydale.apk

      - name: Release yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" foydale.apk \
            --title "foydale.uz v1.${{ github.run_number }}" \
            --notes "Android ilova (APK). Yuklab olib, telefonga o'rnating."
