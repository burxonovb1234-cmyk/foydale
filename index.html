<!doctype html>
<html lang="uz">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#16301f;--mut:#5b6e61;--pri:#1f7a46;--onpri:#fff;--pri2:#e3f3e8;--line:#dbe6dd;--warn:#fff4d6;--warnink:#5c4a00}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a13;--card:#17251c;--ink:#e6f0e8;--mut:#9db3a3;--pri:#4cc07a;--onpri:#0b1d12;--pri2:#1d3326;--line:#27402f;--warn:#3a3318;--warnink:#f2dd8a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 10px;border-bottom:1px solid var(--line);max-width:560px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-size:22px}
h1{font-size:20px;margin:0;line-height:1.1}
.sub{margin:0;color:var(--mut);font-size:13px}
.hrow{display:flex;align-items:center;gap:8px}
label.sel{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);flex:1;min-width:0}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
select{flex:1}
#lang{flex:0 0 auto;width:auto}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}
.big{background:var(--pri);color:var(--onpri);border-color:var(--pri);text-align:center}
.big .nm{font-size:15px;opacity:.9}
.big .tm{font-size:44px;font-weight:700;line-height:1.1}
.big .cd{font-size:15px;opacity:.95;margin-top:2px;font-variant-numeric:tabular-nums}
.date{color:var(--mut);font-size:13px;margin:0 0 4px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;border-radius:10px}
.row+.row{border-top:1px solid var(--line)}
.row.on{background:var(--pri2);border-color:transparent;font-weight:700}
.row .t{font-variant-numeric:tabular-nums;font-size:18px}
.mut{color:var(--mut);font-size:13px}
.note{background:var(--warn);color:var(--warnink);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}
details{margin-bottom:12px}
details>summary{cursor:pointer;font-weight:600;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;list-style:none}
details[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
details>.in{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:12px 14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.adj{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin:6px 0}
.adj input{width:100%}
.dial{width:190px;height:190px;margin:6px auto;display:block}
.dial .arrow{transform-origin:100px 100px;transition:transform .2s}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--pri);color:var(--onpri);font-weight:600;cursor:pointer}
button.alt{background:var(--pri2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--pri2);border-radius:999px;padding:5px 11px;font-size:14px}
.st{font-weight:700;margin:8px 0 4px}
.ok{color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .full{grid-column:1/-1}
.res{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--pri2);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav .in{display:flex;gap:4px;width:100%;max-width:560px}
nav button{flex:1;background:transparent;color:var(--mut);padding:8px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav button .ic{font-size:20px}
nav button .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--pri2);color:var(--ink)}
.btnlink{display:inline-block;background:var(--pri);color:var(--onpri);text-decoration:none;font-weight:600;padding:10px 14px;border-radius:12px}
.sw{width:42px;height:42px;border-radius:50%;padding:0;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.dial .arrow polygon,.dial .arrow circle{fill:var(--pri)}
[hidden]{display:none!important}
p{margin:6px 0}
.pwd-wrap{position:relative}
.pwd-wrap input{width:100%;padding-right:40px}
.pwd-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:17px;user-select:none}
.pwd-meter-wrap{height:8px;background:var(--bg);border-radius:6px;margin:14px 0 6px;overflow:hidden;border:1px solid var(--line)}
.pwd-meter-fill{height:100%;width:0%;border-radius:6px;transition:width .3s ease,background .3s ease}
.pwd-label{text-align:center;font-weight:700;margin-bottom:14px;min-height:20px}
.pwd-checks{display:flex;flex-direction:column;gap:6px;font-size:14px}
.pwd-checks div{color:var(--mut)}
.pwd-crack{text-align:center;margin-top:10px}
/* Tarjimon */
.trbar{display:flex;align-items:center;gap:6px}
.trbar select{flex:1}
.trbar .swap{flex:0 0 auto;padding:9px 12px;font-size:18px;line-height:1}
.trin{width:100%;min-height:110px;resize:vertical;margin-top:10px;display:block}
.trout{margin-top:10px;padding:12px;border-radius:12px;background:var(--pri2);min-height:56px;white-space:pre-wrap;word-break:break-word;font-size:18px;font-weight:600}
.trout.err{background:var(--warn);color:var(--warnink);font-size:14px;font-weight:500}
.trout.idle{color:var(--mut);font-weight:400;font-size:14px}
.tract{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.trcnt{text-align:right;margin:2px 2px 0}
/* Yashirin statistika (faqat muallif) */
#verBox{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.stbox{background:var(--pri2);border-radius:12px;padding:10px;text-align:center}
.stbox b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stbox span{font-size:12px;color:var(--mut)}
.stlist{margin:6px 0 10px}
.stlist h3{font-size:14px;margin:10px 0 4px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}
.bar .bl{flex:0 0 96px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .bf{height:100%;background:var(--pri);border-radius:6px}
.bar .bv{flex:0 0 36px;text-align:right;font-variant-numeric:tabular-nums}
.admrow{display:flex;gap:8px;margin-top:8px}
.admrow input{flex:1}
</style>

<!-- ================= DEHQON ================= -->
<section id="tab-dehqon" hidden>

<section id="tab-xavfsizlik" hidden>

    <p><a id="tgLink" class="btnlink" href="#" target="_blank" rel="noopener noreferrer" data-i="sup_btn"></a></p>

  <div class="card">
    <h2 data-i="sec_title"></h2>
    <p data-i="sec1"></p>
    <p data-i="sec2"></p>
    <p data-i="sec3"></p>
    <p data-i="sec4"></p>
    <p data-i="sec5"></p>
  </div>
  <div class="card">
    <h2 data-i="inst_title"></h2>
    <p data-i="inst_text"></p>
  </div>
</section>
</main>

<nav data-al="nav_aria"><div class="in">

<script>
(function(){
'use strict';

var AUTHOR = 'Bexruz'; // <-- muallif ismi
var TELEGRAM = 'masudjonovich';   // <-- Telegram username'ingiz, @ belgisisiz

// Yashirin statistika paroli (faqat SHA-256 hash saqlanadi, parolning o'zi kodda yo'q).
// Almashtirish: printf '%s' "foydale.uz|v1|YANGI_PAROL" | sha256sum
var ADMIN_HASH = 'bexruzcoderman001$$$$';
var ADMIN_SALT = 'foydale.uz|v1|';

//#PURE-START
var TZ = 5; // O'zbekiston: UTC+5, yozgi vaqt yo'q
var D2R = Math.PI / 180;
function sn(d){ return Math.sin(d * D2R); }
function cs(d){ return Math.cos(d * D2R); }
function fixa(a, b){ a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; }

function sunPos(jd){
  var d = jd - 2451545.0;
  var g = fixa(357.529 + 0.98560028 * d, 360);
  var q = fixa(280.459 + 0.98564736 * d, 360);
  var L = fixa(q + 1.915 * sn(g) + 0.020 * sn(2 * g), 360);
  var e = 23.439 - 0.00000036 * d;
  var RA = fixa(Math.atan2(cs(e) * sn(L), cs(L)) / D2R / 15, 24);
  var eqt = q / 15 - RA;
  if (eqt > 12) eqt -= 24;
  if (eqt < -12) eqt += 24;
  var decl = Math.asin(sn(e) * sn(L)) / D2R;
  return { decl: decl, eqt: eqt };
}

var METHODS = {
  mwl: { n: 'Muslim World League (Bomdod 18°, Xufton 17°)', f: 18, i: 17 },
  kar: { n: 'Karachi (Bomdod 18°, Xufton 18°)', f: 18, i: 18 }
};

function prayerTimes(lat, lng, y, m, d, method){
  var jd = Date.UTC(y, m - 1, d) / 86400000 + 2440587.5;
  var sp = sunPos(jd + 0.5 - lng / 360);
  var noon = 12 + TZ - lng / 15 - sp.eqt;
  function hang(a){
    var x = (-sn(a) - sn(sp.decl) * sn(lat)) / (cs(sp.decl) * cs(lat));
    x = Math.max(-1, Math.min(1, x));
    return Math.acos(x) / D2R / 15;
  }
  function asrAng(f){
    var a = -Math.atan(1 / (f + Math.tan(Math.abs(lat - sp.decl) * D2R))) / D2R;
    var x = (-sn(a) - sn(sp.decl) * sn(lat)) / (cs(sp.decl) * cs(lat));
    x = Math.max(-1, Math.min(1, x));
    return Math.acos(x) / D2R / 15;
  }
  return {
    fajr: noon - hang(method.f),
    sunrise: noon - hang(0.833),
    dhuhr: noon,
    asr: noon + asrAng(2),
    maghrib: noon + hang(0.833),
    isha: noon + hang(method.i)
  };
}

function qiblaBearing(lat, lng){
  var p2 = 21.4225, l2 = 39.8262;
  var dl = (l2 - lng) * D2R, p1 = lat * D2R, pp = p2 * D2R;
  var b = Math.atan2(Math.sin(dl), Math.cos(p1) * Math.tan(pp) - Math.sin(p1) * Math.cos(dl)) / D2R;
  return fixa(b, 360);
}

function cropStatus(windows, off, y, m, d){
  var today = Date.UTC(y, m - 1, d), DAY = 86400000;
  var best = null;
  for (var yr = y; yr <= y + 1; yr++){
    for (var i = 0; i < windows.length; i++){
      var w = windows[i];
      var s = Date.UTC(yr, w[0] - 1, w[1]) + off * DAY;
      var e = Date.UTC(yr, w[2] - 1, w[3]) + off * DAY;
      if (today >= s && today <= e) return { state: 'now', left: Math.round((e - today) / DAY), start: s, end: e };
      if (s > today && (best === null || s < best.start)) best = { state: 'next', days: Math.round((s - today) / DAY), start: s, end: e };
    }
  }
  return best;
}
//#PURE-END

/* ============ SHA-256 (parol tekshirish uchun, kutubxonasiz) ============ */
var SHA_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,

  else if (e.type === 'deviceorientationabsolute' && typeof e.alpha === 'number') hd = 360 - e.alpha;
  if (hd !== null){ heading = hd; updateArrow(); }
}
function startCompass(){
  var D = window.DeviceOrientationEvent;
  if (!D){ setKeyed('compassMsg', 'c_nodev'); return; }
  function go(){
    window.addEventListener('deviceorientationabsolute', onOrient, true);
    window.addEventListener('deviceorientation', onOrient, true);
    compassOn = true;
    setKeyed('compassMsg', 'c_ok');
  }
  if (typeof D.requestPermission === 'function'){
    D.requestPermission().then(function(r){
      if (r === 'granted') go(); else setKeyed('compassMsg', 'c_denied');
    }).catch(function(){ setKeyed('compassMsg', 'c_err'); });
  } else go();
}

function calc(){
  var out = $('calcOut');
  var area = parseFloat($('area').value), norm = parseFloat($('norm').value);
  var unit = $('unit').value;
  out.hidden = false;
  if (!isFinite(area) || !isFinite(norm) || area <= 0 || norm <= 0 || area > 1e6 || norm > 1e6){
    out.textContent = t('calc_err');
    return;
  }
  var ga = unit === 'sotix' ? area / 100 : area;
  var kg = ga * norm;
  var txt = t('calc_total', { kg: Math.round(kg * 10) / 10 });
  if (kg >= 50) txt += t('calc_bags', { b: Math.round(kg / 50 * 10) / 10 });
  txt += t('calc_area', { g: Math.round(ga * 1000) / 1000 });
  out.textContent = txt;
  S.calc++; saveStats();
}

/* ===================== TARJIMON ===================== */
var trTimer = null, trSeq = 0, trLast = '';
function trIsResult(){ var c = $('trOut').className; return !!trLast && c.indexOf('err') < 0 && c.indexOf('idle') < 0; }
function trSetOut(text, cls){
  keyed.trOut = null;
  var o = $('trOut');
  o.textContent = text;
  o.className = 'trout' + (cls ? ' ' + cls : '');
}
function trSetKey(key, cls){ setKeyed('trOut', key, 'trout' + (cls ? ' ' + cls : '')); }
function decodeEntities(s){
  var ta = document.createElement('textarea');
  ta.innerHTML = s;
  return ta.value;
}
function doTranslate(){
  var text = $('trIn').value.trim();
  var from = $('trFrom').value, to = $('trTo').value;
  var seq = ++trSeq;
  setKeyed('trMsg', null);
  if (!text){ trLast = ''; trSetKey('tr_idle', 'idle'); return; }
  if (from === to){ trSetOut(text); trLast = text; return; }
  if (navigator.onLine === false){ trSetKey('tr_off', 'err'); return; }
  trSetKey('tr_ing', 'idle');
  var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) +
            '&langpair=' + encodeURIComponent(from + '|' + to);
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var tm = setTimeout(function(){ if (ctl) ctl.abort(); }, 12000);
  fetch(url, ctl ? { signal: ctl.signal } : undefined).then(function(r){
    if (!r.ok) throw new Error('http' + r.status);
    return r.json();
  }).then(function(j){
    clearTimeout(tm);
    if (seq !== trSeq) return;
    var status = parseInt(j && j.responseStatus, 10);
    var res = j && j.responseData && j.responseData.translatedText;
    if (status === 200 && typeof res === 'string' && res){
      res = decodeEntities(res);
      trLast = res;
      trSetOut(res);
      S.tr++; bump(S.pairs, from + '>' + to); saveStats();
    } else if (status === 429){
      trSetKey('tr_limit', 'err');
    } else {
      trSetKey('tr_fail', 'err');
    }
  }).catch(function(){
    clearTimeout(tm);
    if (seq !== trSeq) return;
    trSetKey('tr_neterr', 'err');
  });
}
function scheduleTranslate(){
  clearTimeout(trTimer);
  $('trCnt').textContent = $('trIn').value.length;
  trTimer = setTimeout(doTranslate, 700);
}
function fillLangSelect(sel){
  var cur = sel.value, i;
  if (!sel.options.length){
    for (i = 0; i < LANGS.length; i++){ var o = E('option', null, ''); o.value = LANGS[i][0]; sel.appendChild(o); }
  }
  for (i = 0; i < LANGS.length; i++) sel.options[i].textContent = LANGS[i][1 + L[lang]];
  if (cur) sel.value = cur;
}
function setupTranslator(){
  var f = $('trFrom'), tt = $('trTo');
  fillLangSelect(f); fillLangSelect(tt);
  function okLang(v){ return LANGS.some(function(l){ return l[0] === v; }); }
  var sf = store('trFrom'), st = store('trTo');
  f.value = okLang(sf) ? sf : 'uz';
  tt.value = okLang(st) ? st : 'en';
  trSetKey('tr_idle', 'idle');
  f.addEventListener('change', function(){ store('trFrom', f.value); doTranslate(); });
  tt.addEventListener('change', function(){ store('trTo', tt.value); doTranslate(); });
  $('trSwap').addEventListener('click', function(){
    var wasResult = trIsResult();
    var a = f.value; f.value = tt.value; tt.value = a;
    store('trFrom', f.value); store('trTo', tt.value);
    if (wasResult){
      $('trIn').value = trLast.slice(0, 500);
      $('trCnt').textContent = $('trIn').value.length;
    }
    doTranslate();
  });
  $('trIn').addEventListener('input', scheduleTranslate);
  $('trGo').addEventListener('click', function(){ clearTimeout(trTimer); doTranslate(); });
  $('trClear').addEventListener('click', function(){
    clearTimeout(trTimer); trSeq++; trLast = '';
    $('trIn').value = ''; $('trCnt').textContent = '0';
    setKeyed('trMsg', null);
    trSetKey('tr_idle', 'idle');
  });
  $('trCopy').addEventListener('click', function(){
    if (!trIsResult()){ setKeyed('trMsg', 'tr_copy_first'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(trLast).then(function(){
        setKeyed('trMsg', 'tr_copied');
      }).catch(function(){ setKeyed('trMsg', 'tr_copy_fail'); });
    } else {
      setKeyed('trMsg', 'tr_copy_fail');
    }
  });
}

/* ===================== PAROL TEKSHIRUVCHI ===================== */
function pwdFormatTime(sec){
  var u = t('pw_units');
  if (sec < 1) return t('pw_instant');
  var units = [[31536000000,u[0]],[31536000,u[1]],[2592000,u[2]],[86400,u[3]],[3600,u[4]],[60,u[5]],[1,u[6]]];
  for (var i = 0; i < units.length; i++){
    if (sec >= units[i][0]) return Math.floor(sec / units[i][0]) + ' ' + units[i][1];
  }
  return t('pw_instant');
}
var PW_IDS = ['len','upper','lower','num','sym','common'];
function pwUpdate(){
  var v = $('pwdInput').value, chk = t('pw_chk'), meter = $('pwdMeter'), label = $('pwdLabel'), crack = $('pwdCrack');
  var i, r;
  if (!v){
    meter.style.width = '0%'; meter.style.background = '';
    label.textContent = t('pw_empty'); label.style.color = 'var(--mut)';
    crack.textContent = '';
    for (i = 0; i < PW_IDS.length; i++){ r = $('pwd-' + PW_IDS[i]); r.style.color = 'var(--mut)'; r.textContent = '○ ' + chk[i]; }
    return;
  }
  var hasLen = v.length >= 8, hasUpper = /[A-Z]/.test(v), hasLower = /[a-z]/.test(v),
      hasNum = /[0-9]/.test(v), hasSym = /[^A-Za-z0-9]/.test(v);
  var isCommon = COMMON_PWDS.indexOf(v.toLowerCase()) > -1;
  var vals = [hasLen, hasUpper, hasLower, hasNum, hasSym, !isCommon];
  for (i = 0; i < PW_IDS.length; i++){
    r = $('pwd-' + PW_IDS[i]);
    r.style.color = vals[i] ? '#2f9e52' : 'var(--mut)';
    r.textContent = (vals[i] ? '✓ ' : '○ ') + chk[i];
  }
  var score = vals.filter(Boolean).length;
  if (isCommon) score = Math.min(score, 1);
  var pct, color, text;
  if (score <= 2){ pct = 25; color = '#e04b4b'; text = t('pw_weak'); }
  else if (score <= 4){ pct = 60; color = '#d98c1f'; text = t('pw_mid'); }
  else { pct = 100; color = '#2f9e52'; text = t('pw_strong'); }
  meter.style.width = pct + '%'; meter.style.background = color;
  label.textContent = text; label.style.color = color;
  var charset = 0;
  if (hasLower) charset += 26;
  if (hasUpper) charset += 26;
  if (hasNum) charset += 10;
  if (hasSym) charset += 32;
  if (!charset) charset = 26;
  var seconds = Math.pow(charset, v.length) / 1e9 / 2;
  crack.textContent = isCommon ? t('pw_crack_common') : t('pw_crack', { t: pwdFormatTime(seconds) });
}
var pwCounted = false;
function setupPasswordChecker(){
  var input = $('pwdInput'), eye = $('pwdEye'), checksBox = $('pwdChecks');
  PW_IDS.forEach(function(id){
    var row = E('div', null, '');
    row.id = 'pwd-' + id;
    checksBox.appendChild(row);
  });
  eye.addEventListener('click', function(){
    input.type = input.type === 'password' ? 'text' : 'password';
    eye.textContent = input.type === 'password' ? '👁️' : '🙈';
  });
  input.addEventListener('input', function(){
    if (!pwCounted && input.value){ pwCounted = true; S.pw++; saveStats(); }
    pwUpdate();
  });
  pwUpdate();
}

function applyTheme(){
  var dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  var p = dark ? THEMES[state.theme].d : THEMES[state.theme].l;
  var r = document.documentElement.style;
  r.setProperty('--pri', p[0]);
  r.setProperty('--pri2', p[1]);
  r.setProperty('--onpri', dark ? '#0d1410' : '#ffffff');
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', p[0]);
  var sw = qsa('.sw');
  for (var i = 0; i < sw.length; i++) sw[i].setAttribute('aria-pressed', String(i === state.theme));
}

/* ===================== YASHIRIN STATISTIKA ===================== */
var adminOpen = false, lockUntil = +store('lk') || 0, fails = 0;
function admMsg(txt){ $('admMsg').textContent = txt; }
function barList(title, map, labelFn, limit){
  var wrap = E('div', 'stlist');
  wrap.appendChild(E('h3', null, title));
  var keys = Object.keys(map).sort(function(a, b){ return map[b] - map[a]; }).slice(0, limit || 8);
  if (!keys.length){ wrap.appendChild(E('p', 'mut', '—')); return wrap; }
  var max = map[keys[0]] || 1;
  keys.forEach(function(k){
    var row = E('div', 'bar');
    row.appendChild(E('div', 'bl', labelFn ? labelFn(k) : k));
    var bt = E('div', 'bt'), bf = E('div', 'bf');
    bf.style.width = Math.max(4, Math.round(map[k] / max * 100)) + '%';
    bt.appendChild(bf); row.appendChild(bt);
    row.appendChild(E('div', 'bv', String(map[k])));
    wrap.appendChild(row);
  });
  return wrap;
}
function statBox(num, label){
  var b = E('div', 'stbox');
  b.appendChild(E('b', null, String(num)));
  b.appendChild(E('span', null, label));
  return b;
}
function renderStats(){
  var body = $('stBody');
  body.textContent = '';
  var n = nowTZ();
  var tdy = S.days[dayKey(n.y, n.m, n.d)] || 0;
  var last7 = {}, sum7 = 0, i;
  for (i = 6; i >= 0; i--){
    var dt = new Date(Date.UTC(n.y, n.m - 1, n.d - i));
    var k = dayKey(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
    last7[k] = S.days[k] || 0; sum7 += last7[k];
  }
  var g = E('div', 'stgrid');
  g.appendChild(statBox(S.opens, 'Jami ochilish'));
  g.appendChild(statBox(tdy, 'Bugun'));
  g.appendChild(statBox(sum7, 'So\'nggi 7 kun'));
  g.appendChild(statBox(S.tr, 'Tarjimalar'));
  g.appendChild(statBox(S.calc, 'Urug\' hisoblash'));
  g.appendChild(statBox(S.pw, 'Parol tekshiruv'));
  body.appendChild(g);
  var fd = new Date(S.first + TZ * 3600000);
  body.appendChild(E('p', 'mut', 'Birinchi kirish: ' + dayKey(fd.getUTCFullYear(), fd.getUTCMonth() + 1, fd.getUTCDate())));
  var wrap = E('div', 'stlist');
  wrap.appendChild(E('h3', null, 'Kunlar bo\'yicha (7 kun)'));
  var mx = 1; for (var kk in last7){ if (last7[kk] > mx) mx = last7[kk]; }
  Object.keys(last7).forEach(function(k2){
    var row = E('div', 'bar');
    row.appendChild(E('div', 'bl', k2.slice(5)));
    var bt = E('div', 'bt'), bf = E('div', 'bf');
    bf.style.width = (last7[k2] ? Math.max(4, Math.round(last7[k2] / mx * 100)) : 0) + '%';
    bt.appendChild(bf); row.appendChild(bt);
    row.appendChild(E('div', 'bv', String(last7[k2])));
    wrap.appendChild(row);
  });
  body.appendChild(wrap);
  var tabNames = { namoz: 'Namoz', dehqon: 'Dehqon', tarjima: 'Tarjima', xavfsizlik: 'Parol', haqida: 'Haqida' };
  body.appendChild(barList('Bo\'limlar', S.tabs, function(k){ return tabNames[k] || k; }));
  body.appendChild(barList('Til', S.langs, function(k){ return k === 'uz' ? 'O\'zbekcha' : k === 'ru' ? 'Русский' : k === 'en' ? 'English' : k; }));
  body.appendChild(barList('Viloyat', S.regions, function(k){ var c = CITIES[+k]; return c ? c.n[0] : k; }));
  body.appendChild(barList('Tarjima yo\'nalishi', S.pairs, function(k){ return k.replace('>', ' → '); }));
}
function lockAdmin(){
  adminOpen = false;
  $('adminStats').hidden = true;
  $('stBody').textContent = '';
  $('adminLogin').hidden = true;
  $('admPw').value = ''; admMsg('');
}
function unlockAdmin(){
  adminOpen = true;
  $('adminLogin').hidden = true;
  $('admPw').value = ''; admMsg('');
  renderStats();
  $('adminStats').hidden = false;
}
function tryLogin(){
  var now = Date.now();
  if (now < lockUntil){ admMsg('Ko\'p urinish. ' + Math.ceil((lockUntil - now) / 1000) + ' soniya kuting.'); return; }
  var pw = $('admPw').value;
  if (pw && sha256(ADMIN_SALT + pw) === ADMIN_HASH){ fails = 0; unlockAdmin(); return; }
  fails++;
  $('admPw').value = '';
  if (fails >= 5){
    fails = 0; lockUntil = now + 60000; store('lk', String(lockUntil));
    admMsg('Ko\'p urinish. 60 soniya kuting.');
  } else {
    admMsg('Parol noto\'g\'ri.');
  }
}
function setupAdmin(){
  var taps = [];
  $('verBox').addEventListener('click', function(){
    var now = Date.now();
    taps.push(now);
    taps = taps.filter(function(x){ return now - x < 3000; });
    if (taps.length >= 5){
      taps = [];
      if (!adminOpen){ $('adminLogin').hidden = false; $('admPw').focus(); }
    }
  });
  $('admGo').addEventListener('click', tryLogin);
  $('admPw').addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });
  $('stClose').addEventListener('click', lockAdmin);
  $('stClear').addEventListener('click', function(){
    var keep = S.first;
    S = loadStats(); S.opens = 0; S.tr = 0; S.calc = 0; S.pw = 0; S.days = {}; S.tabs = {}; S.langs = {}; S.regions = {}; S.pairs = {};
    S.first = keep; saveStats(); renderStats();
  });
}

var TABS = ['namoz','dehqon','tarjima','xavfsizlik','haqida'];
function showTab(name, user){
  TABS.forEach(function(x){ $('tab-' + x).hidden = (x !== name); });
  var bs = qsa('nav button');
  for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-selected', bs[i].getAttribute('data-tab') === name ? 'true' : 'false');
  store('tab', name);
  if (user){ bump(S.tabs, name); saveStats(); }
  if (name !== 'haqida') lockAdmin();
  window.scrollTo(0, 0);
}

  var tg = String(TELEGRAM).replace(/^@/, '');

      var v = clampInt(inp.value, -15, 15, 0); inp.value = v; state.adj[k] = v; store('adj_' + k, v); renderAll();

  $('calcBtn').addEventListener('click', calc);
  $('seedBtn').addEventListener('click', useSeed);

  setupPasswordChecker();
  setupTranslator();
  setupAdmin();

  for (var i = 0; i < bs.length; i++) bs[i].addEventListener('click', function(){ showTab(this.getAttribute('data-tab'), true); });

  // Har ochilishni sanash (faqat shu qurilmada)
  S.opens++; bump(S.days, today()); bump(S.langs, lang); saveStats();

  relabel();
  var tb = store('tab');
  showTab(TABS.indexOf(tb) > -1 ? tb : 'namoz', false);
  setInterval(tick, 1000);
  setInterval(renderNowCrops, 3600000);

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
})();
